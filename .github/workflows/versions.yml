name: Pinned version check

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Runs never overlap, so two of them cannot both create the issue.
concurrency:
  group: pinned-version-check
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare pins and reconcile the managed issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/check_versions.py --markdown "$RUNNER_TEMP/versions.md" --sync-issue "$GITHUB_REPOSITORY"
