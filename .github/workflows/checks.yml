name: Portable policy checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test rejection and client-boundary logic
        run: python -m unittest discover -s tests -v
      - name: Require a passing native Windows profile lookup
        if: runner.os == 'Windows'
        run: python tests/verify_windows_profile.py
  runtime-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Set up the reviewed Docker Engine generation
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
        with:
          version: v29.8.2
          context: rea-verification
      - name: Build REA from the audited lockfile
        run: docker --context rea-verification build --tag rea-local:6.7.0-ghidra-12.1.4-locked skills/rea-isolated/assets
      - name: Build both pinned receiving clients
        run: docker --context rea-verification build --file skills/rea-isolated/assets/agent/Dockerfile --tag rea-agent-local:codex-0.163.0-claude-2.1.302-locked skills/rea-isolated
      - name: Verify both real clients and real REA analysis without a model API
        run: python tests/verify_runtime.py --context rea-verification --scratch-root "$RUNNER_TEMP" > "$RUNNER_TEMP/runtime-verification.json"
      - name: Pull the digest-pinned image scanner
        run: |
          python - <<'PY'
          import subprocess
          import sys
          sys.path.insert(0, "tools")
          from scan_images import SCANNER_IMAGE
          subprocess.run(["docker", "--context", "rea-verification", "pull", SCANNER_IMAGE], check=True)
          PY
      - name: Inventory both built images and report all vulnerability findings
        run: python tools/scan_images.py --context rea-verification --output-dir "$RUNNER_TEMP/image-scan"
      - name: Retain runtime evidence, image reports and SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-audit-linux-amd64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runtime-verification.json
            ${{ runner.temp }}/image-scan/*.json
            ${{ runner.temp }}/image-scan/*.log
          if-no-files-found: warn
          retention-days: 14
