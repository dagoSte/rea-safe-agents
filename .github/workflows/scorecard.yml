name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 7 * * 1'

permissions:
  contents: read

concurrency:
  group: openssf-scorecard
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Analyze repository practices and publish the results
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.json
          results_format: json
          publish_results: true
      - name: Retain the complete assessment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssf-scorecard-${{ github.sha }}
          path: results.json
          retention-days: 14
          if-no-files-found: warn
